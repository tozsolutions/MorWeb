<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hero Slogan Animasyonu - Demo</title>
<style>
:root{
  --bg:#0d0118;
  --purple:#8b5cf6;
  --purple2:#a78bfa;
  --pink:#ec4899;
  --cyan:#06b6d4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}

/* HERO SLIDER ANIMATION */
.hero-slogan-container{
  padding:2rem;
  background:rgba(139,92,246,0.08);
  border:1px solid rgba(139,92,246,0.2);
  border-radius:16px;
  backdrop-filter:blur(10px);
  max-width:700px;
  width:100%;
}
.hero-slogan-wrapper{
  position:relative;
  height:80px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero-slogan{
  position:absolute;
  font-size:clamp(1.3rem,3vw,1.8rem);
  font-weight:700;
  color:#fff;
  text-align:center;
  width:100%;
  opacity:0;
  transform:translateY(30px);
  transition:all 0.8s cubic-bezier(0.68,-0.55,0.265,1.55);
}
.hero-slogan.active{
  opacity:1;
  transform:translateY(0);
}
.hero-slogan.exit{
  opacity:0;
  transform:translateY(-30px);
}
.hero-slogan-icon{
  display:inline-block;
  margin-right:0.5rem;
  animation:iconBounce 2s infinite;
}
@keyframes iconBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
.slogan-indicators{
  display:flex;
  justify-content:center;
  gap:0.5rem;
  margin-top:1rem;
}
.slogan-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(139,92,246,0.3);
  transition:all 0.3s;
  cursor:pointer;
}
.slogan-dot.active{
  background:var(--purple2);
  box-shadow:0 0 10px var(--purple2);
  transform:scale(1.2);
}
.slogan-dot:hover{
  transform:scale(1.3);
}

/* Preview Text */
.preview-text{
  text-align:center;
  margin-bottom:2rem;
  color:var(--purple2);
  font-size:0.9rem;
  text-transform:uppercase;
  letter-spacing:0.1em;
}
</style>
</head>
<body>

<div>
  <div class="preview-text">✨ Hero Slogan Animasyonu Demo ✨</div>
  
  <div class="hero-slogan-container">
    <div class="hero-slogan-wrapper">
      <div class="hero-slogan active">
        <span class="hero-slogan-icon">🚀</span>
        <span>Keşif için hazır olun!</span>
      </div>
      <div class="hero-slogan">
        <span class="hero-slogan-icon">✨</span>
        <span>Aradığınız Ürün Bizde!</span>
      </div>
      <div class="hero-slogan">
        <span class="hero-slogan-icon">💡</span>
        <span>Akıllı Çözümler, Mükemmel Sonuçlar!</span>
      </div>
      <div class="hero-slogan">
        <span class="hero-slogan-icon">🎯</span>
        <span>Hayalinizdeki Yapıyı Birlikte İnşa Edelim!</span>
      </div>
    </div>
    <div class="slogan-indicators">
      <div class="slogan-dot active" data-index="0"></div>
      <div class="slogan-dot" data-index="1"></div>
      <div class="slogan-dot" data-index="2"></div>
      <div class="slogan-dot" data-index="3"></div>
    </div>
  </div>
</div>

<script>
(function heroSloganSlider(){
  const slogans=document.querySelectorAll('.hero-slogan');
  const dots=document.querySelectorAll('.slogan-dot');
  let currentIndex=0;
  const intervalTime=4000; // 4 saniye
  
  function changeSlogan(){
    // Mevcut slogan'ı çıkar
    slogans[currentIndex].classList.remove('active');
    slogans[currentIndex].classList.add('exit');
    dots[currentIndex].classList.remove('active');
    
    // Sonraki slogana geç
    currentIndex=(currentIndex+1)%slogans.length;
    
    // Yeni slogan'ı göster (küçük bir gecikme ile)
    setTimeout(()=>{
      slogans.forEach(s=>s.classList.remove('exit'));
      slogans[currentIndex].classList.add('active');
      dots[currentIndex].classList.add('active');
    },100);
  }
  
  // Otomatik değişim
  setInterval(changeSlogan,intervalTime);
  
  // Dot tıklayınca manuel değişim
  dots.forEach((dot,index)=>{
    dot.addEventListener('click',()=>{
      // Mevcut slogan'ı çıkar
      slogans[currentIndex].classList.remove('active');
      dots[currentIndex].classList.remove('active');
      
      // Yeni index
      currentIndex=index;
      
      // Yeni slogan'ı göster
      slogans[currentIndex].classList.add('active');
      dots[currentIndex].classList.add('active');
    });
  });
})();
</script>

</body>
</html>
